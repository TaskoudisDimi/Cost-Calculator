services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-billcalculator-fb2dd}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/serviceAccountKey
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GIN_MODE=release
    secrets:
      - serviceAccountKey
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

secrets:
  serviceAccountKey:
    file: ./backend/serviceAccountKey.json
